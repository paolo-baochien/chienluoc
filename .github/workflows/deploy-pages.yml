name: Pubblica app su GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
      - name: Prepara pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Installa dipendenze
        run: pnpm install --frozen-lockfile
      - name: Costruisci app
        run: pnpm build:pages
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara pubblicazione
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
